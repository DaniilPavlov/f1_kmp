name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Firebase stub
        run: cp tool/ci/google-services.stub.json composeApp/google-services.json

      - name: Detekt
        run: ./gradlew :composeApp:detekt --stacktrace

      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: composeApp/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: composeApp/build/reports/detekt/
          if-no-files-found: ignore
